<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>إدارة الكوادر | AOSS MEDIA</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="wrap" id="app" style="margin-bottom:60px"><div class="empty" style="margin:60px 0">جاري التحميل…</div></main>
  <script type="module">
    import { chrome, esc, money, $, $$, toast, waLink } from './js/ui.js';
    import { categoryLabel, isAdmin, imageSrc, api, syncToSalla, sallaLink } from './js/store.js';

    const embedded = new URLSearchParams(location.search).get('embedded') === '1';
    if (embedded) document.body.classList.add('embedded');
    const b = await chrome('');
    if (embedded) await embeddedLogin();

    // Inside the Salla merchant dashboard: verify the Salla session and sign in as admin.
    async function embeddedLogin() {
      try {
        await new Promise((ok, fail) => {
          const s = document.createElement('script');
          s.src = 'https://unpkg.com/@salla.sa/embedded-sdk/dist/umd/index.js';
          s.onload = ok; s.onerror = fail;
          document.head.appendChild(s);
        });
        const sdk = (window.Salla && window.Salla.embedded) || (window.SallaEmbeddedSDK && window.SallaEmbeddedSDK.embedded);
        await sdk.init({});
        const token = sdk.auth.getToken();
        if (!token) throw new Error('no token');
        const { customToken } = await api('/sso/embedded', { token });
        await b.signInWithToken(customToken);
        if (sdk.ready) sdk.ready();
      } catch (e) {
        document.querySelector('#app').innerHTML = '<div class="empty" style="margin:60px 0">تعذّر التحقق من جلسة سلة. أعد فتح الصفحة من لوحة التحكم.</div>';
      }
    }
    const app = $('#app');
    const ST = { pending: 'بانتظار الاعتماد', approved: 'معتمد', hidden: 'مخفي' };
    const BS = { new: 'جديد', accepted: 'مقبول', declined: 'مرفوض', done: 'منفّذ' };
    let view = 'talents';
    let filter = 'pending';

    b.onAuth((u) => {
      if (!u) { app.innerHTML = '<div class="empty" style="margin:60px 0">سجّل الدخول من <a href="dashboard.html">لوحة الكادر</a> بحساب الإدارة.</div>'; return; }
      if (!isAdmin()) { app.innerHTML = '<div class="empty" style="margin:60px 0">هذه الصفحة للإدارة فقط.</div>'; return; }
      render();
    });

    async function render() {
      app.innerHTML = `
        <div class="panel" style="margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <h2 style="margin:0;flex:1">لوحة الإدارة</h2>
          <button class="chip" data-v="talents" aria-pressed="${view === 'talents'}">الكوادر</button>
          <button class="chip" data-v="bookings" aria-pressed="${view === 'bookings'}">الحجوزات</button>
        </div>
        <div id="body" class="panel">جاري التحميل…</div>`;
      $$('[data-v]').forEach((x) => x.addEventListener('click', () => { view = x.dataset.v; render(); }));
      view === 'talents' ? talents() : bookings();
    }

    async function talents() {
      const list = (await b.listTalents({ all: true })).sort((a, c) => (c.updatedAt || 0) - (a.updatedAt || 0));
      const counts = list.reduce((m, t) => ((m[t.status] = (m[t.status] || 0) + 1), m), {});
      const shown = list.filter((t) => !filter || t.status === filter);
      const avatars = await Promise.all(shown.map((t) => imageSrc(t.avatar || t.cover)));
      $('#body').innerHTML = `
        <div class="chips" style="margin-bottom:14px">${['pending', 'approved', 'hidden', ''].map((s) => `<button class="chip" data-f="${s}" aria-pressed="${filter === s}">${s ? ST[s] : 'الكل'} (${s ? counts[s] || 0 : list.length})</button>`).join('')}</div>
        ${shown.map((t, i) => `
          <div class="bk" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
            <div style="width:56px;height:56px;border-radius:50%;background:#ddd center/cover url('${esc(avatars[i])}')"></div>
            <div style="flex:1;min-width:200px"><b>${esc(t.name || '(بدون اسم)')}</b> <span class="status ${t.status}">${ST[t.status] || t.status}</span>
              <div class="muted">${esc(categoryLabel(t))} · ${esc((t.cities || []).join('، '))} · ${(t.gallery || []).length} صور · ${(t.services || []).length} خدمات · ${(t.packages || []).length} باقات</div>
              <div class="hint">${esc(t.email || '')} ${t.social?.whatsapp ? '· ' + esc(t.social.whatsapp) : ''}</div></div>
            <div class="acts" style="display:flex;gap:6px;flex-wrap:wrap">
              <a class="btn sm ghost" target="_blank" rel="noopener" href="profile.html?u=${encodeURIComponent(t.uid)}">معاينة</a>
              ${sallaLink(t) ? `<a class="btn sm ghost" target="_blank" rel="noopener" href="${esc(sallaLink(t).url)}">في المتجر</a>` : ''}
              ${t.status === 'approved' ? `<button class="btn sm ghost" data-sync="${t.uid}">مزامنة</button>` : ''}
              ${t.status !== 'approved' ? `<button class="btn sm" data-s="approved" data-id="${t.uid}">اعتماد</button>` : ''}
              ${t.status !== 'hidden' ? `<button class="btn sm ghost" data-s="hidden" data-id="${t.uid}">إخفاء</button>` : ''}
            </div>
          </div>`).join('') || '<p class="muted">لا يوجد.</p>'}`;
      $$('[data-f]').forEach((x) => x.addEventListener('click', () => { filter = x.dataset.f; talents(); }));
      $$('[data-s]').forEach((x) => x.addEventListener('click', async () => {
        x.disabled = true;
        await b.setStatus(x.dataset.id, x.dataset.s);
        toast('تم التحديث — جاري المزامنة مع المتجر…');
        try { await syncToSalla(x.dataset.id); toast('تمت المزامنة مع سلة ✓'); } catch (e) { toast('المزامنة: ' + e.message); }
        talents();
      }));
      $$('[data-sync]').forEach((x) => x.addEventListener('click', async () => {
        x.disabled = true;
        try { await syncToSalla(x.dataset.sync); toast('تمت المزامنة مع سلة ✓'); } catch (e) { toast('المزامنة: ' + e.message); }
        talents();
      }));
    }

    async function bookings() {
      const list = await b.listBookings();
      const contacts = await Promise.all(list.map((x) => b.getContact(x.id).catch(() => null)));
      $('#body').innerHTML = list.map((x, i) => {
        const c = contacts[i] || {};
        return `<div class="bk">
          <div class="top-row"><b>${x.orderRef ? 'طلب سلة #' + esc(x.orderRef) : '#' + esc(x.id.slice(-6))} — ${esc(x.talentName)} · ${esc(x.item?.name || '')}${x.paid ? ' · <span class="status approved">مدفوع</span>' : ''}</b><span class="status ${x.status}">${BS[x.status] || x.status}</span></div>
          <div class="muted">📅 ${esc(x.date)} ${esc(x.time)} · 📍 ${esc(x.city)} · ${money(x.total)} ${x.deposit ? '· عربون ' + money(x.deposit) : ''}</div>
          <div>${esc(c.name || '')} · <a href="${waLink(c.phone && c.phone.replace(/^0/, '966'), 'مرحبًا ' + (c.name || '') + '، بخصوص طلب حجز ' + x.talentName)}" target="_blank" rel="noopener" dir="ltr">${esc(c.phone || '')}</a></div>
          ${x.notes ? `<div class="hint" style="white-space:pre-line">${esc(x.notes)}</div>` : ''}
          <div class="acts">${['new', 'accepted', 'declined', 'done'].filter((s) => s !== x.status).map((s) => `<button class="btn sm ghost" data-b="${s}" data-id="${x.id}">${BS[s]}</button>`).join('')}</div>
        </div>`;
      }).join('') || '<p class="muted">لا توجد حجوزات.</p>';
      $$('[data-b]').forEach((x) => x.addEventListener('click', async () => {
        await b.updateBooking(x.dataset.id, { status: x.dataset.b });
        toast('تم التحديث');
        bookings();
      }));
    }
  </script>
</body>
</html>
